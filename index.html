<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AmBitious データまとめ</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

    <header class="header">
        <h1>AmBitious データまとめ</h1>
    </header>

    <nav class="tabs">
        <button id="youtubeBtn" class="active">YouTube</button>
        <button id="performanceBtn">パフォーマンス</button>
        <button id="itadakishasuBtn">いただきシャス</button>
        <button id="locipoBtn">Locipo</button>
        <button id="tverSingleBtn">TVer</button>
    </nav>

    <div class="update-area">
        <section class="update-info">
            <span class="label">最終更新</span>
            <span id="updateDate"></span>
        </section>
    </div>

    <main class="content">

        <img
            id="dashboardImage"
            src="images/youtube_layout.png"
            alt="YouTube Dashboard"
        >

        <section class="video-list">

            <h2>📋 動画一覧</h2>

            <div class="video-controls">

                <div class="video-search">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="動画タイトル・出演者・学校名を検索"
                    >
                </div>

                <div class="video-filter">
                    <select id="memberFilter">
                        <option value="">すべて</option>
                    </select>
                </div>

                <div class="video-sort">
                    <select id="sortSelect">
                        <option value="newest">新しい順</option>
                        <option value="oldest">古い順</option>
                        <option value="views-desc">再生回数が多い順</option>
                        <option value="views-asc">再生回数が少ない順</option>
                        <option value="likes-desc">高評価が多い順</option>
                        <option value="likes-asc">高評価が少ない順</option>
                        <option value="comments-desc">コメント数が多い順</option>
                        <option value="comments-asc">コメント数が少ない順</option>
                        <option value="ranking-asc">順位が良い順</option>
                    </select>
                </div>

            </div>

            <div class="video-result-info">

                <span id="videoCount"></span>

                <button id="clearSearchBtn">
                    すべて表示
                </button>

            </div>

            <div id="videoCards"></div>

        </section>

        <section class="history">

            <h2>更新履歴</h2>

            <div class="history-item">
                <div class="history-date">2026/08/29</div>
                <div class="history-text">Ver.1.3 TVer単発番組の掲載を開始</div>
            </div>
            <div class="history-item">
                <div class="history-date">2026/08/09</div>
                <div class="history-text">Ver.1.2 動画一覧の検索・絞り込み・並べ替え機能を追加</div>
            </div>
            <div class="history-item">
                <div class="history-date">2026/08/09</div>
                <div class="history-text">Ver.1.1 動画一覧を追加</div>
            </div>
            <div class="history-item">
                <span class="history-date">2026/08/03</span>
                <span class="history-text">Ver.1.0 公開</span>
            </div>

            <div class="notice">
                <p>データは2026年4月以降のものを掲載しています。</p>
                <p>掲載内容は順次拡充予定です。</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

<footer class="footer">
    <span>© 2026 AmBitious データまとめ</span>
    <span>Unofficial Fan Site</span>
</footer>

</html>
