<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AmBitious データまとめ</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

    <header class="header">
        <h1>AmBitious データまとめ</h1>
    </header>

    <nav class="tabs">
        <button id="youtubeBtn" class="active">YouTube</button>
        <button id="tverBtn">TVer</button>
        <button id="locipoBtn">Locipo</button>
    </nav>

    <div class="update-area">
        <section class="update-info">
            <span class="label">最終更新</span>
            <span id="updateDate"></span>
        </section>
    </div>

    <main class="content">

        <img
            id="dashboardImage"
            src="images/youtube_layout.png"
            alt="YouTube Dashboard"
        >

        <section class="history">

            <h2>更新履歴</h2>

            <div class="history-item">
                <span class="history-date">2026/08/04</span>
                <span class="history-text">Ver.1.0 公開</span>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

<footer class="footer">
    <span>© 2026 AmBitious データまとめ</span>
    <span>Unofficial Fan Site</span>
</footer>

</html>
